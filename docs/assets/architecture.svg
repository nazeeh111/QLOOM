<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1010" role="img" aria-labelledby="title description"><title id="title">QLOOM compiler architecture</title><desc id="description">Offline graph-aware surrogate training ranks configurations for a hard-budget native compiler. Independent phase-and-mapping verification precedes hardware metrics, optional noise simulation, Studio inspection and export.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#315d7a" stroke-width="1.3"/></marker></defs><rect width="1360" height="1010" fill="#f3f2ec"/><g transform="translate(43 36) scale(1.3)" fill="none" stroke="#315d7a" stroke-width="2.6"><path d="M5 10h18c7 0 7 20 14 20M5 20h30M5 30h18c7 0 7-20 14-20"/><path d="M12 4v32M22 4v32" stroke="#bc7e35"/></g><text  x="105" y="76" font-family="sans-serif" font-size="39" font-weight="700" fill="#203239" text-anchor="start">QLOOM</text><text  x="1280" y="68" font-family="monospace" font-size="13" font-weight="400" fill="#647277" text-anchor="end">SYSTEM ARCHITECTURE / v0.1</text><text  x="50" y="134" font-family="sans-serif" font-size="32" font-weight="500" fill="#203239" text-anchor="start">Learn where to search. Verify what you find.</text><text  x="50" y="165" font-family="sans-serif" font-size="16" font-weight="400" fill="#647277" text-anchor="start">Offline learning and online compilation are distinct. Logical verification is independent of noise evaluation.</text><g id="offline-lane"><rect x="35" y="195" width="1295" height="225" rx="10" fill="#e9ede7"/><text  x="55" y="224" font-family="monospace" font-size="12" font-weight="400" fill="#647277" text-anchor="start">01  OFFLINE / REPRODUCIBLE TRAINING</text><g id="training-evaluations"><rect x="55" y="245" width="300" height="148" rx="8" fill="#fffefa" stroke="#cfd6cf"/><rect x="55" y="245" width="4" height="148" rx="2" fill="#315d7a"/><text  x="75" y="275" font-family="sans-serif" font-size="18" font-weight="600" fill="#203239" text-anchor="start">Real compiler evaluations</text><text  x="75" y="302" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">Generated training circuits × devices</text><text  x="75" y="325" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">All 24 native configurations</text><text  x="75" y="348" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">Verified cost labels, no test labels</text></g><g id="graph-features"><rect x="385" y="245" width="265" height="148" rx="8" fill="#fffefa" stroke="#cfd6cf"/><rect x="385" y="245" width="4" height="148" rx="2" fill="#315d7a"/><text  x="405" y="275" font-family="sans-serif" font-size="18" font-weight="600" fill="#203239" text-anchor="start">Graph-aware features</text><text  x="405" y="302" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">Circuit interaction statistics</text><text  x="405" y="325" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">Topology and placement distances</text><text  x="405" y="348" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">Configuration descriptors</text></g><g id="model-fit"><rect x="680" y="245" width="285" height="148" rx="8" fill="#fffefa" stroke="#cfd6cf"/><rect x="680" y="245" width="4" height="148" rx="2" fill="#315d7a"/><text  x="700" y="275" font-family="sans-serif" font-size="18" font-weight="600" fill="#203239" text-anchor="start">ExtraTrees regression</text><text  x="700" y="302" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">Fit normalized hardware cost</text><text  x="700" y="325" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">Training seeds and source retained</text><text  x="700" y="348" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">Compact, CPU-compatible model</text></g><g id="json-model"><rect x="995" y="245" width="310" height="148" rx="8" fill="#fffefa" stroke="#cfd6cf"/><rect x="995" y="245" width="4" height="148" rx="2" fill="#bc7e35"/><text  x="1015" y="275" font-family="sans-serif" font-size="18" font-weight="600" fill="#203239" text-anchor="start">Frozen JSON model</text><text  x="1015" y="302" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">Tree arrays, feature order, metadata</text><text  x="1015" y="325" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">Content hash in each report</text><text  x="1015" y="348" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">No executable pickle artifact</text></g><path d="M356 319L382 319" stroke="#315d7a" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><path d="M651 319L677 319" stroke="#315d7a" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><path d="M966 319L992 319" stroke="#315d7a" stroke-width="2" fill="none"  marker-end="url(#arrow)"/></g><text  x="55" y="466" font-family="monospace" font-size="12" font-weight="400" fill="#647277" text-anchor="start">02  ONLINE / A BOUNDED COMPILATION EXPERIMENT</text><g id="input-validation"><rect x="55" y="490" width="260" height="145" rx="8" fill="#fffefa" stroke="#cfd6cf"/><rect x="55" y="490" width="4" height="145" rx="2" fill="#315d7a"/><text  x="75" y="520" font-family="sans-serif" font-size="18" font-weight="600" fill="#203239" text-anchor="start">Circuit + processor</text><text  x="75" y="547" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">OpenQASM 2 / Python circuit</text><text  x="75" y="570" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">2–8 qubits; terminal measurement</text><text  x="75" y="593" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">Connected, synthetic U/CX device</text></g><g id="budgeted-ranking"><rect x="350" y="490" width="285" height="145" rx="8" fill="#fffefa" stroke="#cfd6cf"/><rect x="350" y="490" width="4" height="145" rx="2" fill="#315d7a"/><text  x="370" y="520" font-family="sans-serif" font-size="18" font-weight="600" fill="#203239" text-anchor="start">Rank 24 configurations</text><text  x="370" y="547" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">Frozen model scores graph features</text><text  x="370" y="570" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">Select only the requested budget</text><text  x="370" y="593" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">Default demonstration: 4 evaluations</text></g><g id="native-compiler"><rect x="670" y="490" width="300" height="145" rx="8" fill="#fffefa" stroke="#cfd6cf"/><rect x="670" y="490" width="4" height="145" rx="2" fill="#315d7a"/><text  x="690" y="520" font-family="sans-serif" font-size="18" font-weight="600" fill="#203239" text-anchor="start">QLOOM native compiler</text><text  x="690" y="547" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">Commuting inverse / rotation rewrites</text><text  x="690" y="570" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">Interaction-aware initial placement</text><text  x="690" y="593" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">Shortest / lookahead SWAP routing</text></g><g id="semantics-gate"><rect x="1005" y="490" width="300" height="145" rx="8" fill="#fffefa" stroke="#cfd6cf"/><rect x="1005" y="490" width="4" height="145" rx="2" fill="#387455"/><text  x="1025" y="520" font-family="sans-serif" font-size="18" font-weight="600" fill="#203239" text-anchor="start">Independent semantics gate</text><text  x="1025" y="547" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">NumPy interpreter, full unitary</text><text  x="1025" y="570" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">Initial / final logical mappings</text><text  x="1025" y="593" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">Global phase + random input checks</text></g><path d="M316 562L347 562" stroke="#315d7a" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><path d="M636 562L667 562" stroke="#315d7a" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><path d="M971 562L1002 562" stroke="#315d7a" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><path id="model-to-ranking" d="M1150 394V444H492V487" stroke="#bc7e35" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow)"/><path id="verified-only" d="M1155 637V680H1065V716" stroke="#315d7a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text  x="1140" y="669" font-family="monospace" font-size="11" font-weight="400" fill="#387455" text-anchor="end">passed only</text><g id="hardware-evaluation"><rect x="855" y="720" width="450" height="138" rx="8" fill="#fffefa" stroke="#cfd6cf"/><rect x="855" y="720" width="4" height="138" rx="2" fill="#bc7e35"/><text  x="875" y="750" font-family="sans-serif" font-size="18" font-weight="600" fill="#203239" text-anchor="start">Hardware cost + optional noise</text><text  x="875" y="777" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">CX count, depth, duration, cost proxy, measured wall time</text><text  x="875" y="800" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">Aer density matrix: simulated output distributions</text><text  x="875" y="823" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">Noisy similarity never serves as equivalence proof</text></g><g id="studio-export"><rect x="350" y="720" width="450" height="138" rx="8" fill="#fffefa" stroke="#cfd6cf"/><rect x="350" y="720" width="4" height="138" rx="2" fill="#315d7a"/><text  x="370" y="750" font-family="sans-serif" font-size="18" font-weight="600" fill="#203239" text-anchor="start">Inspectable Studio + reproducible export</text><text  x="370" y="777" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">Candidate records, routing replay, Pareto frontier</text><text  x="370" y="800" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">OpenQASM + mappings + global phase sidecar</text><text  x="370" y="823" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">Complete experiment report and baseline evidence</text></g><path d="M852 789L803 789" stroke="#315d7a" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><g id="baselines"><rect x="55" y="720" width="260" height="138" rx="8" fill="#fffefa" stroke="#cfd6cf"/><rect x="55" y="720" width="4" height="138" rx="2" fill="#315d7a"/><text  x="75" y="750" font-family="sans-serif" font-size="18" font-weight="600" fill="#203239" text-anchor="start">Established baselines</text><text  x="75" y="777" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">Qiskit optimization levels 0–3</text><text  x="75" y="800" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">MQT QMAP and BQSKit</text><text  x="75" y="823" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">Same width, gates and coupling</text></g><path id="baseline-evaluation" d="M185 861V894H1080V861" stroke="#315d7a" stroke-width="1.7" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow)"/><text  x="425" y="916" font-family="sans-serif" font-size="13" font-weight="400" fill="#647277" text-anchor="start">Baselines have independently checked semantics and separately reported compilation effort.</text><path d="M50 950L1305 950" stroke="#cfd6cf" stroke-width="2" fill="none"  /><text  x="50" y="980" font-family="monospace" font-size="12" font-weight="400" fill="#647277" text-anchor="start">SCOPE  Unitary circuits + terminal measurements · no ancillas, resets, dynamic control or real QPU execution</text></svg>